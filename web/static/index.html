<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CyberTrust Agents — MCP Dashboard</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div id="session-gate" class="session-gate">
  <span class="spinner" aria-hidden="true"></span>
  <span>Verification de la session...</span>
</div>

<div id="app-shell" class="app-shell hidden">
  <header class="topnav" id="topnav"></header>

  <main class="container">
    <section class="panel" id="summary-panel" aria-label="Synthese">
      <div id="summary-cards" class="summary-grid"></div>
    </section>

    <section class="panel" id="evidence-panel" aria-labelledby="evidence-heading">
      <h2 id="evidence-heading">1. Catalogue Evidence</h2>
      <p class="panel-helper">Recherchez, filtrez et selectionnez les Evidence a soumettre au pipeline MCP.</p>
      <div id="evidence-filters"></div>
      <div id="evidence-table-container"></div>
    </section>

    <section class="panel" id="request-panel" aria-labelledby="request-heading">
      <h2 id="request-heading">2. Requete CISO</h2>
      <div id="ciso-request-form"></div>
    </section>

    <section class="panel" id="config-panel" aria-labelledby="config-heading">
      <h2 id="config-heading">3. Configuration du pipeline</h2>
      <div id="pipeline-config"></div>
    </section>

    <section class="panel" id="launch-panel">
      <button id="launch-btn" class="btn btn-primary" disabled>Lancer l'analyse MCP</button>
      <div id="pipeline-progress"></div>
    </section>

    <section class="panel hidden" id="results-panel" aria-labelledby="results-heading">
      <h2 id="results-heading">4. Resultat du pipeline</h2>
      <div id="results-content"></div>
    </section>

    <section class="panel hidden" id="journal-panel" aria-labelledby="journal-heading">
      <h2 id="journal-heading">5. Journal d'audit de la session</h2>
      <div class="table-scroll">
        <table>
          <thead><tr><th>Etat</th><th>Evenement</th><th>Role</th><th>Resultat</th><th>Detail</th><th>Horodatage</th></tr></thead>
          <tbody id="journal-tbody"></tbody>
        </table>
      </div>
    </section>
  </main>
</div>

<script type="module" src="/js/main.js"></script>
</body>
</html>
