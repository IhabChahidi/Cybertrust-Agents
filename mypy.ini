# Minimal mypy configuration, scoped to the new/modified Generator+RAG
# modules from this hardening phase (see ruff.toml for the same rationale:
# the legacy repository was never type-checked before this pass). `files`
# sets the default check set when mypy is invoked with no arguments.

[mypy]
python_version = 3.13
files =
    mcp_server/generator_claims.py,
    mcp_server/generator_prompts.py,
    mcp_server/generator_service.py,
    mcp_server/llamacpp_config.py,
    mcp_server/llm_roles/llamacpp_client.py,
    mcp_server/llm_roles/foundation_sec_generator.py,
    mcp_server/rag,
    web/generator_api.py,
    scripts

ignore_missing_imports = True
no_implicit_optional = True
warn_unused_ignores = True
warn_redundant_casts = True
# Not enabling disallow_untyped_defs / strict-optional / disallow-any-*:
# this codebase mixes dataclasses, Pydantic models, and dict-shaped JSON
# payloads validated by jsonschema rather than mypy -- a strict profile
# would demand a much larger rewrite than this hardening phase's scope.
