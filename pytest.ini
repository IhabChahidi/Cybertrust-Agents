[pytest]
testpaths = tests
python_files = test_*.py
markers =
    unit: fast, no external dependency
    integration: exercises the full pipeline (mock or deterministic-fake LLM responses)
    ollama: requires a live local Ollama server; skipped automatically if unavailable
    rag_model: requires the real local sentence-transformers embedding model (downloads once); skips if unavailable
    frontend: JS-side rendering/escaping checks (run via Node, see tests/frontend/)
    security: adversarial / injection / attack-class tests
    regression: reproduces a specific historical incident or bug
    real_model: requires a live llama.cpp server hosting the real Foundation-Sec GGUF; opt-in only, gated on RUN_REAL_MODEL_TESTS=true, never runs in normal CI
